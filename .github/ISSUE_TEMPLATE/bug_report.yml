name: Bug Report
description: Report a reproducible bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of SkillBridge are you running?
      placeholder: '0.1.0-alpha'
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Your operating system and Node.js version
      placeholder: 'Windows 11, Node.js 20.11.0'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `skillbridge parse some-file.md`
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error output if applicable.
  - type: textarea
    id: logs
    attributes:
      label: Relevant Output
      description: Please copy and paste any relevant output. This will be automatically formatted.
      render: shell
